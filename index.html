  {id:"15",wbs:"4.1", name:"Production Deployment",         level:1,par:false,pid:"14",start:"2025-09-16",end:"2025-09-25",dur:9, prog:0,  status:"Not Started",prio:"Critical",asn:"Isaac",     budget:5000, spent:0,    pred:"13", notes:"",desc:"",subtasks:[],comments:[]},

/* ═══ SMALL COMPONENTS (top-level) ═════════════════════ */
function SBadge({s}){const c=STATUS_CFG[s]||STATUS_CFG["Not Started"];return<span style={{display:"inline-flex",alignItems:"center",gap:5,background:c.bg,borderRadius:999,padding:"2px 9px",whiteSpace:"nowrap",fontSize:11,fontWeight:500,color:c.tx}}><span style={{width:6,height:6,borderRadius:"50%",background:c.dot,flexShrink:0,display:"inline-block"}}/>{s}</span>}
function PBadge({p}){return<span style={{display:"inline-flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,borderRadius:"50%",background:PRIO_C[p]||"#94A3B8",flexShrink:0,display:"inline-block"}}/><span style={{fontSize:12,fontWeight:500}}>{p}</span></span>}
function PBar({v}){return<div style={{display:"flex",alignItems:"center",gap:6}}><div style={{flex:1,height:5,background:"#E2E8F0",borderRadius:999,overflow:"hidden",minWidth:50}}><div style={{width:v+"%",height:"100%",background:v===100?"#22C55E":AC,borderRadius:999,transition:"width .3s"}}/></div><span style={{fontSize:11,fontWeight:600,color:"#64748B",minWidth:28}}>{v}%</span></div>}
function Ava({name,size=22}){if(!name)return null;const i=name.split(" ").map(w=>w[0]).join("").substr(0,2).toUpperCase();const pal=["#6366F1","#3B82F6","#10B981","#F59E0B","#EF4444","#8B5CF6","#EC4899"];return<span style={{width:size,height:size,borderRadius:"50%",background:pal[name.charCodeAt(0)%pal.length],color:"white",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:size*0.42,fontWeight:600,flexShrink:0}}>{i}</span>}
function Divider(){return<div style={{height:1,background:"rgba(255,255,255,0.08)",margin:"6px 8px"}}/>}

/* ═══ EDIT INPUT (top-level — critical for focus fix) ════ */
function EditInput({f,type,opts,val,setVal,commit,cancel}){
  const r=useRef(null);
  useEffect(()=>{if(r.current){r.current.focus();try{r.current.select()}catch{}};},[]);
  const ok=e=>{if(e.key==="Enter"&&type!=="textarea"){e.preventDefault();commit();}if(e.key==="Escape"){e.preventDefault();cancel();}};
  const bs={border:"none",outline:"none",background:"transparent",fontFamily:f==="wbs"?"'JetBrains Mono',monospace":"inherit",fontSize:13,color:"inherit",width:"100%",padding:0};
  if(type==="select")return<select ref={r} value={val} onChange={e=>setVal(e.target.value)} onBlur={commit} onKeyDown={ok} style={{...bs,cursor:"pointer"}}>{opts.map(o=><option key={o}>{o}</option>)}</select>;
  if(type==="date")return<input ref={r} type="date" value={val} onChange={e=>setVal(e.target.value)} onBlur={commit} onKeyDown={ok} style={{...bs,fontSize:12}}/>;
  return<input ref={r} type={type||"text"} value={val} onChange={e=>setVal(e.target.value)} onBlur={commit} onKeyDown={ok} style={{...bs,textAlign:["budget","spent","dur"].includes(f)?"center":"left"}}/>;
}

/* ═══ TASK CARD (Jira-style right panel) ════════════════ */
function TaskCard(){
  const {tasks,setTasks,cardId,setCardId,users}=useCx();
  const t=tasks.find(x=>x.id===cardId);
  const [comment,setComment]=useState("");
  if(!t)return null;
  const upd=(f,v)=>setTasks(p=>p.map(x=>x.id===t.id?{...x,[f]:v}:x));
  const addSub=()=>{const s=prompt("Subtask name:");if(s)upd("subtasks",[...(t.subtasks||[]),{id:uid(),text:s,done:false}])};
  const toggleSub=sid=>upd("subtasks",(t.subtasks||[]).map(s=>s.id===sid?{...s,done:!s.done}:s));
  const addComment=()=>{if(!comment.trim())return;upd("comments",[...(t.comments||[]),{id:uid(),text:comment,ts:new Date().toLocaleString(),user:"You"}]);setComment("")};
  const statOpts=Object.keys(STATUS_CFG),prioOpts=Object.keys(PRIO_C);
  const sel={border:"1px solid #E2E8F0",borderRadius:7,padding:"5px 8px",fontSize:12,fontFamily:"inherit",outline:"none",background:"white",cursor:"pointer",width:"100%"};
  return(
    <div style={{position:"fixed",top:0,right:0,width:420,height:"100vh",background:"white",borderLeft:"1px solid #E2E8F0",zIndex:500,display:"flex",flexDirection:"column",boxShadow:"-8px 0 40px rgba(0,0,0,0.12)"}}>
      <div style={{padding:"14px 16px",borderBottom:"1px solid #E2E8F0",display:"flex",justifyContent:"space-between",alignItems:"center",background:"#F8FAFF",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#94A3B8",fontWeight:600}}>{t.wbs}</span>
          <SBadge s={t.status}/>
        </div>
        <button onClick={()=>setCardId(null)} style={{border:"none",background:"#F1F5F9",cursor:"pointer",width:28,height:28,borderRadius:6,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",color:"#64748B"}}>✕</button>
      </div>
      <div style={{flex:1,overflow:"auto",padding:"16px"}}>
        <textarea value={t.name} onChange={e=>upd("name",e.target.value)} style={{width:"100%",border:"none",outline:"none",fontSize:17,fontWeight:700,color:"#1E293B",resize:"none",fontFamily:"inherit",background:"transparent",lineHeight:1.3,marginBottom:12}} rows={2}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          {[["Status","status","select",statOpts],["Priority","prio","select",prioOpts],["Assignee","asn","text",null],["Start","start","date",null],["Finish","end","date",null],["% Done","prog","number",null],["Budget ($)","budget","number",null],["Actual ($)","spent","number",null],["Predecessors","pred","text",null]].map(([lbl,fld,typ,opts])=>(
            <div key={fld} style={{gridColumn:fld==="name"||fld==="pred"||fld==="notes"?"1/-1":"auto"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>{lbl}</div>
              {typ==="select"?<select value={t[fld]||""} onChange={e=>upd(fld,e.target.value)} style={sel}>{opts.map(o=><option key={o}>{o}</option>)}</select>
               :typ==="date"?<input type="date" value={t[fld]||""} onChange={e=>upd(fld,e.target.value)} style={sel}/>
               :<input type={typ} value={t[fld]||""} onChange={e=>upd(fld,e.target.value)} style={sel}/>}
            </div>
          ))}
        </div>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Owners</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {users.map(u=>{
              const selected=(t.owners||t.assignees||[]).includes(u.id)||t.ownerId===u.id||t.asn===u.name;
              return <button key={u.id} onClick={()=>{const current=t.owners||t.assignees||[];const next=selected?current.filter(id=>id!==u.id):[...current,u.id];upd("owners",next);upd("assignees",next);if(next.length)upd("asn",users.filter(x=>next.includes(x.id)).map(x=>x.name).join(", "));}} style={{border:selected?`1px solid ${AC}`:"1px solid #E2E8F0",background:selected?"#EEF2FF":"white",color:selected?AC:"#64748B",borderRadius:999,padding:"5px 10px",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{u.name}</button>
            })}
          </div>
        </div>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Description</div>
          <textarea value={t.desc||""} onChange={e=>upd("desc",e.target.value)} placeholder="Add a description…" rows={3} style={{width:"100%",border:"1px solid #E2E8F0",borderRadius:8,padding:"8px 10px",fontSize:13,fontFamily:"inherit",outline:"none",resize:"vertical",color:"#374151"}}/>
        </div>
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <div style={{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:"0.06em"}}>Subtasks ({(t.subtasks||[]).length})</div>
            <button onClick={addSub} style={{fontSize:11,color:AC,border:"none",background:"none",cursor:"pointer",fontWeight:600}}>+ Add</button>
          </div>
          {(t.subtasks||[]).map(s=>(
            <div key={s.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",borderRadius:6,background:s.done?"#F0FDF4":"#F8FAFF",marginBottom:4}}>
              <input type="checkbox" checked={s.done} onChange={()=>toggleSub(s.id)} style={{cursor:"pointer"}}/>
              <span style={{fontSize:13,flex:1,textDecoration:s.done?"line-through":"none",color:s.done?"#94A3B8":"#374151"}}>{s.text}</span>
              <button onClick={()=>upd("subtasks",(t.subtasks||[]).filter(x=>x.id!==s.id))} style={{border:"none",background:"none",cursor:"pointer",color:"#F87171",fontSize:12}}>✕</button>
            </div>
          ))}
        </div>
        <div>
          <div style={{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>Activity</div>
          {(t.comments||[]).map(c=>(
            <div key={c.id} style={{display:"flex",gap:8,marginBottom:10}}>
              <Ava name={c.user} size={26}/>
              <div><div style={{fontSize:11,fontWeight:600,color:"#1E293B"}}>{c.user} <span style={{color:"#94A3B8",fontWeight:400}}>{c.ts}</span></div><div style={{fontSize:13,color:"#374151",marginTop:2}}>{c.text}</div></div>
            </div>
          ))}
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <textarea value={comment} onChange={e=>setComment(e.target.value)} placeholder="Add a comment…" rows={2} style={{flex:1,border:"1px solid #E2E8F0",borderRadius:8,padding:"7px 10px",fontSize:13,fontFamily:"inherit",outline:"none",resize:"none"}}/>

          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══ COLUMN MANAGER ════════════════════════════════════ */
function ColMgr(){
  const {columns,setColumns,setShowColMgr}=useCx();
  const [cols,setCols]=useState(columns.map(c=>({...c})));
  const [newLabel,setNewLabel]=useState(""),newType=useRef("text");
  const save=()=>{setColumns(cols);setShowColMgr(false)};
  const addCol=()=>{if(!newLabel.trim())return;setCols(p=>[...p,{id:uid(),field:"custom_"+uid(),label:newLabel,width:120,type:newType.current,visible:true,align:"left",custom:true}]);setNewLabel("")};
  const toggle=id=>setCols(p=>p.map(c=>c.id===id?{...c,visible:!c.visible}:c));
  const setLabel=(id,v)=>setCols(p=>p.map(c=>c.id===id?{...c,label:v}:c));
  const setWidth=(id,v)=>setCols(p=>p.map(c=>c.id===id?{...c,width:Number(v)||c.width}:c));
  const del=id=>setCols(p=>p.filter(c=>c.id!==id||!c.custom));
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(15,22,41,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:400}}>
      <div style={{background:"white",borderRadius:16,width:580,maxHeight:"85vh",overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 24px 80px rgba(0,0,0,0.25)"}}>
        <div style={{padding:"18px 22px",borderBottom:"1px solid #E2E8F0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <h3 style={{margin:0,fontSize:17,fontWeight:700,color:"#1E293B"}}>Manage Columns</h3>
          <button onClick={()=>setShowColMgr(false)} style={{border:"none",background:"#F1F5F9",cursor:"pointer",width:30,height:30,borderRadius:7,fontSize:16}}>✕</button>

/* ═══ SHEET VIEW (top-level — fixes edit bug) ═══════════ */
function SheetView(){
  const {tasks,setTasks,currentUser,columns,editing,setEditing,editVal,setEditVal,sort,setSort,q,statusFilter,setCardId,taskStyles,setTaskStyles}=useCx();
  const [dragId,setDragId]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const [dragPos,setDragPos]=useState("bot");
  const [fmtRow,setFmtRow]=useState(null); // row being formatted
  const visCols=columns.filter(c=>c.visible);

  const filtered=useMemo(()=>{
    let r=[...tasks];
    if(q){const lq=q.toLowerCase();r=r.filter(t=>t.name.toLowerCase().includes(lq)||(t.asn||"").toLowerCase().includes(lq)||t.wbs.includes(lq))}
    if(statusFilter!=="all")r=r.filter(t=>t.status===statusFilter);
    if(sort.f){r.sort((a,b)=>{const av=a[sort.f],bv=b[sort.f];if(typeof av==="number")return sort.d==="asc"?av-bv:bv-av;return sort.d==="asc"?String(av||"").localeCompare(String(bv||"")):String(bv||"").localeCompare(String(av||""))});}
    return r;
  },[tasks,q,statusFilter,sort]);

  const startEdit=(id,f,v)=>{setEditing({id,f});setEditVal(String(v??""))};
  const commitEdit=()=>{
    if(!editing)return;
    setTasks(prev=>prev.map(t=>{
      if(t.id!==editing.id)return t;
      const nf=["prog","budget","spent","dur"];
      let val=nf.includes(editing.f)?Math.max(0,Number(editVal)||0):editVal;
      if(editing.f==="prog")val=Math.min(100,val);
      const u={...t,[editing.f]:val};
      if((editing.f==="start"||editing.f==="end")&&u.start&&u.end)u.dur=daysBetween(u.start,u.end);
      return u;
    }));
    setEditing(null);
  };

  const addRow=()=>{
    const id=uid();
    setTasks(prev=>[...prev,{id,wbs:String(prev.filter(t=>t.level===0).length+1),name:"New Task",level:0,par:false,pid:null,start:today,end:today,dur:1,prog:0,status:"Not Started",prio:"Medium",asn:currentUser?.name||"",ownerId:currentUser?.id||"",budget:0,spent:0,pred:"",notes:"",desc:"",subtasks:[],comments:[]}]);
    setTimeout(()=>startEdit(id,"name","New Task"),50);
  };

  // Drag and drop
  const onDragStart=(e,id)=>{setDragId(id);e.dataTransfer.effectAllowed="move"};
  const onDragOver=(e,id,rect)=>{e.preventDefault();const mid=rect.top+rect.height/2;const pos=e.clientY<mid?"top":"bot";setDragOver(id);setDragPos(pos)};
  const onDrop=(e,targetId)=>{
    e.preventDefault();
    if(!dragId||dragId===targetId){setDragId(null);setDragOver(null);return}
    setTasks(prev=>{
      const arr=[...prev];
      const fromIdx=arr.findIndex(t=>t.id===dragId);
      const toIdx=arr.findIndex(t=>t.id===targetId);
      if(fromIdx<0||toIdx<0)return prev;
      const [moved]=arr.splice(fromIdx,1);
      const insertAt=dragPos==="top"?toIdx:toIdx+(fromIdx>toIdx?1:0);
      arr.splice(insertAt,0,moved);
      return arr;
    });
    setDragId(null);setDragOver(null);
  };

  const isEd=(id,f)=>editing?.id===id&&editing?.f===f;
  const mkEdit=(f,type,opts)=><EditInput f={f} type={type} opts={opts} val={editVal} setVal={setEditVal} commit={commitEdit} cancel={()=>setEditing(null)}/>;
  const ts=id=>taskStyles[id]||{};
  const toggleBold=id=>setTaskStyles(p=>({...p,[id]:{...(p[id]||{}),bold:!(p[id]?.bold)}}));
  const setRowColor=(id,v)=>setTaskStyles(p=>({...p,[id]:{...(p[id]||{}),rowBg:v}}));
  const setTextColor=(id,v)=>setTaskStyles(p=>({...p,[id]:{...(p[id]||{}),txColor:v}}));

  const renderCell=(t,col)=>{
    const {id:tid,level,par}=t;
    const f=col.field,v=t[f];
    if(isEd(tid,f)){
      const type=col.type==="status"?"select":col.type==="priority"?"select":col.type==="date"?"date":col.type==="number"||col.type==="currency"||col.type==="progress"?"number":"text";
      const opts=col.type==="status"?Object.keys(STATUS_CFG):col.type==="priority"?Object.keys(PRIO_C):undefined;
      return mkEdit(f,type,opts);
    }
    if(col.type==="status")return<SBadge s={v}/>;
    if(col.type==="priority")return<PBadge p={v}/>;
    if(col.type==="progress")return<PBar v={v||0}/>;
    if(col.type==="currency")return<span style={{fontSize:12,fontWeight:500,color:(f==="spent"&&(v||0)>(t.budget||0))?"#EF4444":"#374151"}}>{fmtC(v)}</span>;
    if(col.type==="date")return<span style={{fontSize:12,color:"#64748B"}}>{fmtD(v)}</span>;
    if(f==="wbs")return<span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#64748B"}}>{v}</span>;
    if(f==="name")return<span style={{display:"inline-flex",alignItems:"center",gap:5,cursor:"pointer"}} onClick={e=>{e.stopPropagation();setCardId(tid)}}>
      {par&&<span style={{width:14,height:14,borderRadius:3,background:"linear-gradient(135deg,#6366F1,#818CF8)",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:8,color:"white",fontWeight:700,flexShrink:0}}>P</span>}
      {!par&&level>0&&<span style={{width:6,height:1,background:"#CBD5E1",flexShrink:0,display:"inline-block",marginRight:2}}/>}
      <span style={{textDecoration:"underline",textDecorationStyle:"dotted",textDecorationColor:"#CBD5E1"}}>{v}</span>
    </span>;
    if(f==="asn"&&v)return<span style={{display:"inline-flex",alignItems:"center",gap:5}}><Ava name={v} size={18}/><span style={{fontSize:12,overflow:"hidden",textOverflow:"ellipsis"}}>{v}</span></span>;
    return<span style={{fontSize:12,color:"#64748B",display:"block",overflow:"hidden",textOverflow:"ellipsis"}}>{v}</span>;
  };

  const stats=useMemo(()=>({
    total:filtered.length,
    avgProg:filtered.length?Math.round(filtered.reduce((s,t)=>s+(t.prog||0),0)/filtered.length):0,
    budget:filtered.filter(t=>t.level===0).reduce((s,t)=>s+(t.budget||0),0),
    spent:filtered.filter(t=>t.level===0).reduce((s,t)=>s+(t.spent||0),0),
  }),[filtered]);

  const TH={padding:"8px 10px",textAlign:"left",color:"#64748B",fontWeight:600,fontSize:11,textTransform:"uppercase",letterSpacing:"0.06em",borderBottom:"2px solid #E2E8F0",whiteSpace:"nowrap",userSelect:"none",cursor:"pointer"};
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
      {/* Format toolbar */}
      {fmtRow&&(
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"5px 14px",background:"#EEF2FF",borderBottom:"1px solid #C7D2FE",flexShrink:0,fontSize:12}}>
          <span style={{color:AC,fontWeight:600,fontSize:11}}>Format Row:</span>
          <button onClick={()=>toggleBold(fmtRow)} style={{fontWeight:"bold",border:"1px solid #C7D2FE",borderRadius:5,padding:"2px 10px",cursor:"pointer",background:ts(fmtRow).bold?"#6366F1":"white",color:ts(fmtRow).bold?"white":AC,fontSize:13}}>B</button>
          <label style={{display:"flex",alignItems:"center",gap:4,color:"#64748B",cursor:"pointer"}}>Row Color:<input type="color" defaultValue={ts(fmtRow).rowBg||"#ffffff"} onChange={e=>setRowColor(fmtRow,e.target.value)} style={{width:28,height:24}}/></label>
          <label style={{display:"flex",alignItems:"center",gap:4,color:"#64748B",cursor:"pointer"}}>Text:<input type="color" defaultValue={ts(fmtRow).txColor||"#374151"} onChange={e=>setTextColor(fmtRow,e.target.value)} style={{width:28,height:24}}/></label>
          <button onClick={()=>{setTaskStyles(p=>{const n={...p};delete n[fmtRow];return n});}} style={{fontSize:11,border:"1px solid #E2E8F0",borderRadius:5,padding:"2px 8px",cursor:"pointer",background:"white",color:"#64748B"}}>Reset</button>
          <button onClick={()=>setFmtRow(null)} style={{marginLeft:"auto",fontSize:11,border:"none",background:"none",cursor:"pointer",color:"#94A3B8"}}>✕ Close</button>
        </div>
      )}
      <div style={{overflow:"auto",flex:1}}>
        <table style={{borderCollapse:"collapse",tableLayout:"fixed",minWidth:"100%",fontSize:13}}>
          <colgroup>
            <col style={{width:22}}/><col style={{width:22}}/>{visCols.map(c=><col key={c.id} style={{width:c.width}}/>)}<col style={{width:38}}/>
          </colgroup>
          <thead style={{position:"sticky",top:0,zIndex:10}}>
            <tr style={{background:"#F8FAFF"}}>
              <th style={TH}/><th style={TH}/>
              {visCols.map(c=>(
                <th key={c.id} onClick={()=>setSort(p=>({f:c.field,d:p.f===c.field&&p.d==="asc"?"desc":"asc"}))} style={{...TH,textAlign:c.align}}>
                  <span style={{display:"inline-flex",alignItems:"center",gap:3}}>{c.label}{sort.f===c.field&&<span style={{color:AC,fontSize:9}}>{sort.d==="asc"?"":""}</span>}</span>
                </th>
              ))}
              <th style={TH}/>
            </tr>
          </thead>
          <tbody>
            {filtered.map((t,i)=>{
              const sty=ts(t.id);
              const bg=sty.rowBg||(i%2===0?"#fff":"#FAFBFF");
              const txc=sty.txColor||"#374151";
              const fw=sty.bold?"700":"400";
              const isParent=t.par;
              const cellS=ex=>({padding:"7px 10px",borderBottom:"1px solid #F1F5F9",background:bg,fontWeight:isParent?"600":fw,color:isParent?"#1E293B":txc,verticalAlign:"middle",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",...ex});
              const isOver=dragOver===t.id;
              return(
                <tr key={t.id}
                  draggable
                  onDragStart={e=>onDragStart(e,t.id)}
                  onDragOver={e=>{const rect=e.currentTarget.getBoundingClientRect();onDragOver(e,t.id,rect)}}
                  onDrop={e=>onDrop(e,t.id)}
                  onDragEnd={()=>{setDragId(null);setDragOver(null)}}
                  onClick={()=>setFmtRow(fmtRow===t.id?null:t.id)}
                  className={isOver?(dragPos==="top"?"drag-over-top":"drag-over-bot"):""}
                  style={{cursor:"grab",opacity:dragId===t.id?0.4:1}}
                  onMouseEnter={e=>e.currentTarget.querySelectorAll("td").forEach(td=>td.style.background=i%2===0?"#F0F4FF":"#EBEEFF")}
                  onMouseLeave={e=>e.currentTarget.querySelectorAll("td").forEach(td=>td.style.background=bg)}>
                  <td style={{...cellS(),padding:"0 0 0 4px",cursor:"grab"}}><span style={{fontSize:10,color:"#CBD5E1",userSelect:"none"}}>⠿</span></td>
                  <td style={{...cellS(),padding:"0 0 0 2px"}}><div style={{width:13,height:13,border:"1.5px solid #CBD5E1",borderRadius:3}}/></td>
                  {visCols.map(col=>(
                    <td key={col.id} onDoubleClick={e=>{e.stopPropagation();startEdit(t.id,col.field,t[col.field])}}
                      style={cellS({textAlign:col.align,paddingLeft:col.field==="name"?10+t.level*14:10})}>
                      {renderCell(t,col)}
                    </td>
                  ))}
                  <td style={cellS({textAlign:"center",padding:"0 4px"})}>
                    <button onClick={e=>{e.stopPropagation();setTasks(p=>p.filter(x=>x.id!==t.id&&x.pid!==t.id))}} style={{border:"none",background:"none",cursor:"pointer",color:"#F87171",fontSize:13,opacity:0.5}}>✕</button>
                  </td>
                </tr>
              );
            })}
            {/* + Add row */}
            <tr>
              <td colSpan={visCols.length+3} style={{padding:"6px 10px",borderBottom:"none"}}>
                <button onClick={addRow} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#94A3B8",border:"1px dashed #CBD5E1",background:"transparent",cursor:"pointer",borderRadius:6,padding:"5px 12px",fontFamily:"inherit",transition:"all .15s"}}
                  onMouseEnter={e=>{e.currentTarget.style.color=AC;e.currentTarget.style.borderColor=AC}}
                  onMouseLeave={e=>{e.currentTarget.style.color="#94A3B8";e.currentTarget.style.borderColor="#CBD5E1"}}>
                  <span style={{fontSize:16,lineHeight:1}}>+</span> Add Task
                </button>
              </td>
            </tr>
          </tbody>
          {filtered.length>0&&(
            <tfoot>
              <tr style={{background:"#F0F4FF",borderTop:"2px solid #E2E8F0"}}>
                <td colSpan={4} style={{padding:"8px 10px",fontSize:12,fontWeight:600,color:AC}}>{stats.total} tasks</td>
                {visCols.map(c=>{
                  if(c.field==="prog")return<td key={c.id} style={{padding:"8px 10px"}}><PBar v={stats.avgProg}/></td>;
                  if(c.field==="budget")return<td key={c.id} style={{padding:"8px 10px",textAlign:"right",fontWeight:700,color:"#10B981",fontSize:13}}>{fmtC(stats.budget)}</td>;
                  if(c.field==="spent")return<td key={c.id} style={{padding:"8px 10px",textAlign:"right",fontWeight:700,color:"#F59E0B",fontSize:13}}>{fmtC(stats.spent)}</td>;
                  return<td key={c.id}/>;
                })}
                <td/>
              </tr>
            </tfoot>
          )}
        </table>
      </div>
    </div>
  );
}

/* ═══ GANTT VIEW (top-level) ═══════════════════════════ */
function GanttView(){
  const {tasks,setTasks,collapsed,setCollapsed}=useCx();
  const listRef=useRef(null),chartRef=useRef(null),syncing=useRef(false);
  const toggleCol=id=>setCollapsed(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n});
  const onLS=e=>{if(syncing.current)return;syncing.current=true;if(chartRef.current)chartRef.current.scrollTop=e.target.scrollTop;requestAnimationFrame(()=>{syncing.current=false})};
  const onCS=e=>{if(syncing.current)return;syncing.current=true;if(listRef.current)listRef.current.scrollTop=e.target.scrollTop;requestAnimationFrame(()=>{syncing.current=false})};

  const wbsTasks=useMemo(()=>{
    const out=[];
    const add=pid=>tasks.filter(t=>t.pid===pid).forEach(t=>{out.push(t);if(t.par&&!collapsed.has(t.id))add(t.id)});
    tasks.filter(t=>t.pid===null).forEach(t=>{out.push(t);if(t.par&&!collapsed.has(t.id))add(t.id)});
    return out;
  },[tasks,collapsed]);

  const gantt=useMemo(()=>{
    const all=tasks.flatMap(t=>[new Date(t.start),new Date(t.end)]).filter(d=>!isNaN(d));
    if(!all.length)return null;
    const mn=new Date(Math.min(...all)),mx=new Date(Math.max(...all));
    const start=new Date(mn.getFullYear(),mn.getMonth(),1);
    const end=new Date(mx.getFullYear(),mx.getMonth()+1,0);
    const ms=end-start,months=[];
    let c=new Date(start);
    while(c<=end){months.push(new Date(c));c=new Date(c.getFullYear(),c.getMonth()+1,1)}
    const pct=d=>Math.max(0,Math.min(100,((new Date(d)-start)/ms)*100));
    return{start,end,months,pct,todayPct:pct(new Date())};
  },[tasks]);

  if(!gantt||tasks.length===0)return<div style={{padding:40,textAlign:"center",color:"#94A3B8"}}><div style={{fontSize:32,marginBottom:8}}></div>No tasks to display.</div>;
  const ROW=40,HDR=44,BH=22,LW=320,svgH=wbsTasks.length*ROW+HDR;

  return(
    <div style={{display:"flex",height:"100%",overflow:"hidden"}}>
      <div ref={listRef} onScroll={onLS} style={{width:LW,flexShrink:0,overflow:"auto",borderRight:"1px solid #E2E8F0",background:"white"}}>
        <div style={{height:HDR,display:"flex",alignItems:"center",padding:"0 12px",position:"sticky",top:0,background:"#F8FAFF",borderBottom:"1px solid #E2E8F0",zIndex:2,fontSize:11,fontWeight:600,color:"#64748B",textTransform:"uppercase",letterSpacing:"0.06em"}}>Task Name</div>
        {wbsTasks.map((t,i)=>(
          <div key={t.id} style={{height:ROW,display:"flex",alignItems:"center",paddingLeft:10+t.level*14,paddingRight:8,gap:5,borderBottom:"1px solid #F1F5F9",background:i%2===0?"white":"#FAFBFF"}}>
            {t.par?<button onClick={()=>toggleCol(t.id)} style={{border:"none",background:"none",cursor:"pointer",color:"#94A3B8",padding:0,fontSize:10,lineHeight:1,flexShrink:0}}>{collapsed.has(t.id)?"▶":""}</button>:<span style={{width:12,display:"inline-block"}}/>}
            <span style={{fontSize:12,fontWeight:t.par?600:400,color:t.par?"#1E293B":"#374151",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{t.name}</span>
            <span style={{fontSize:10,color:"#94A3B8",flexShrink:0}}>{t.prog}%</span>
          </div>
        ))}
      </div>
      <div ref={chartRef} onScroll={onCS} style={{flex:1,overflow:"auto"}}>
        <svg width="100%" height={Math.max(svgH,200)} style={{minWidth:600,display:"block"}}>
          <defs><clipPath id="bc"><rect x="0" y={HDR} width="100%" height={svgH-HDR}/></clipPath></defs>
          {gantt.months.map((m,i)=>{const x1=gantt.pct(m),x2=i+1<gantt.months.length?gantt.pct(gantt.months[i+1]):100,w=x2-x1;return<g key={i}><rect x={x1+"%"} y={0} width={w+"%"} height={HDR} fill={i%2===0?"#F8FAFF":"#F1F5F9"} stroke="#E2E8F0" strokeWidth={0.5}/><text x={(x1+0.4)+"%"} y={HDR/2+5} fontSize={11} fill="#64748B" fontWeight={500}>{MONTHS[m.getMonth()]} {m.getFullYear()}</text></g>})}
          {wbsTasks.map((t,i)=><rect key={t.id+"bg"} x={0} y={HDR+i*ROW} width="100%" height={ROW} fill={i%2===0?"white":"#FAFBFF"}/>)}
          {gantt.months.map((m,i)=><line key={i+"vl"} x1={gantt.pct(m)+"%"} y1={HDR} x2={gantt.pct(m)+"%"} y2={svgH} stroke="#E2E8F0" strokeWidth={0.5} strokeDasharray="3,3"/>)}
          {wbsTasks.map((t,i)=><line key={t.id+"hl"} x1={0} y1={HDR+(i+1)*ROW} x2="100%" y2={HDR+(i+1)*ROW} stroke="#F1F5F9" strokeWidth={1}/>)}
          {wbsTasks.map((t,i)=>{
            const lp=gantt.pct(t.start),rp=gantt.pct(t.end),w=Math.max(rp-lp,0.4),y=HDR+i*ROW+(ROW-BH)/2,col=GANTT_C[t.status]||"#94A3B8",pw=w*(t.prog/100);
            return<g key={t.id} clipPath="url(#bc)">
              <rect x={lp+"%"} y={y} width={w+"%"} height={BH} rx={5} fill={col} opacity={0.15}/>
              {t.prog>0&&<rect x={lp+"%"} y={y} width={Math.max(pw,0.2)+"%"} height={BH} rx={5} fill={col}/>}
              <rect x={lp+"%"} y={y} width={w+"%"} height={BH} rx={5} fill="none" stroke={col} strokeWidth={1.5}/>
              {w>4&&<text x={(lp+0.5)+"%"} y={y+BH/2+4} fontSize={10} fill={t.prog>55?"white":col} fontWeight={500}>{t.prog}%</text>}
            </g>;
          })}
          {gantt.todayPct>=0&&gantt.todayPct<=100&&<g>
            <line x1={gantt.todayPct+"%"} y1={0} x2={gantt.todayPct+"%"} y2={svgH} stroke="#EF4444" strokeWidth={1.5} strokeDasharray="4,3" opacity={0.8}/>
            <rect x={(gantt.todayPct-0.4)+"%"} y={HDR-16} width={38} height={15} rx={4} fill="#EF4444"/>
            <text x={gantt.todayPct+"%"} y={HDR-5} fontSize={10} fill="white" fontWeight={700} textAnchor="middle">TODAY</text>
          </g>}
        </svg>
      </div>
    </div>
  );
}

/* ═══ WBS VIEW (top-level) ════════════════════════════ */
function WBSView(){
  const {tasks,setTasks,collapsed,setCollapsed,setCardId}=useCx();
  const toggleCol=id=>setCollapsed(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n});
  const wbsT=useMemo(()=>{
    const out=[];
    const add=pid=>tasks.filter(t=>t.pid===pid).forEach(t=>{out.push(t);if(t.par&&!collapsed.has(t.id))add(t.id)});
    tasks.filter(t=>t.pid===null).forEach(t=>{out.push(t);if(t.par&&!collapsed.has(t.id))add(t.id)});
    return out;
  },[tasks,collapsed]);
  if(wbsT.length===0)return<div style={{padding:40,textAlign:"center",color:"#94A3B8"}}><div style={{fontSize:32,marginBottom:8}}>🌿</div>No tasks yet.</div>;

    <div style={{overflow:"auto",height:"100%",padding:"16px 20px"}}>
      {wbsT.map(t=>(
        <div key={t.id} style={{marginLeft:t.level*24,marginBottom:t.par?10:5,background:"white",borderRadius:10,border:t.par?`2px solid ${AC}`:"1px solid #E2E8F0",padding:"10px 14px",display:"flex",alignItems:"center",gap:10,boxShadow:t.par?"0 2px 10px rgba(99,102,241,0.08)":"0 1px 3px rgba(0,0,0,0.04)"}}>
          {t.par?<button onClick={()=>toggleCol(t.id)} style={{border:"none",cursor:"pointer",background:"rgba(99,102,241,0.1)",color:AC,padding:"2px 7px",fontSize:11,borderRadius:4,flexShrink:0}}>{collapsed.has(t.id)?"▶":""}</button>:<span style={{width:8,height:8,borderRadius:"50%",background:"#CBD5E1",flexShrink:0,display:"inline-block"}}/>}
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#94A3B8",fontWeight:600,minWidth:36,flexShrink:0}}>{t.wbs}</span>
          <span onClick={()=>setCardId(t.id)} style={{fontSize:t.par?14:13,fontWeight:t.par?700:500,color:t.par?"#1E293B":"#374151",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",cursor:"pointer",textDecoration:"underline",textDecorationStyle:"dotted",textDecorationColor:"#CBD5E1"}}>{t.name}</span>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",flexShrink:0}}>

            <span style={{fontSize:11,color:"#94A3B8",whiteSpace:"nowrap"}}>{fmtD(t.start)} → {fmtD(t.end)}</span>
            <span style={{fontSize:12,fontWeight:600,color:"#10B981"}}>{fmtC(t.budget)}</span>
          </div>
          <button onClick={()=>setTasks(p=>p.filter(x=>x.id!==t.id&&x.pid!==t.id))} style={{border:"none",background:"none",cursor:"pointer",color:"#F87171",fontSize:13,opacity:0.5,flexShrink:0}}>✕</button>
        </div>
      ))}
    </div>
  );
}

/* ═══ KANBAN VIEW (top-level) ═══════════════════════════ */
function KanbanView(){
  const {tasks,setTasks,currentUser,setCardId}=useCx();
  const [kanbanCols,setKanbanCols]=useState(Object.keys(STATUS_CFG));
  const [dragKId,setDragKId]=useState(null);
  const [dropCol,setDropCol]=useState(null);
  const moveCard=(taskId,newStatus)=>setTasks(p=>p.map(t=>t.id===taskId?{...t,status:newStatus}:t));
  const addKCol=()=>{const n=prompt("New column name:");if(n&&!kanbanCols.includes(n))setKanbanCols(p=>[...p,n])};
  const remKCol=s=>{if(tasks.some(t=>t.status===s)&&!confirm(`"${s}" has tasks. Remove column?`))return;setKanbanCols(p=>p.filter(x=>x!==s))};
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 14px",background:"white",borderBottom:"1px solid #E2E8F0",flexShrink:0}}>
        <span style={{fontSize:13,fontWeight:600,color:"#64748B"}}>Kanban Board</span>
        <button onClick={addKCol} style={{fontSize:12,color:AC,border:`1px solid ${AC}`,background:"transparent",borderRadius:6,padding:"3px 10px",cursor:"pointer",fontWeight:600,marginLeft:"auto"}}>+ Add Column</button>
      </div>
      <div style={{flex:1,overflow:"auto",padding:"14px",display:"flex",gap:14,alignItems:"flex-start"}}>
        {kanbanCols.map(status=>{
          const cfg=STATUS_CFG[status]||{bg:"#F1F5F9",tx:"#475569",dot:"#94A3B8"};
          const cards=tasks.filter(t=>t.status===status);
          const isDropTarget=dropCol===status;
          return(
            <div key={status}
              onDragOver={e=>{e.preventDefault();setDropCol(status)}}
              onDrop={e=>{e.preventDefault();if(dragKId)moveCard(dragKId,status);setDragKId(null);setDropCol(null)}}
              style={{width:270,flexShrink:0,background:isDropTarget?"#EEF2FF":"#F8FAFF",borderRadius:12,border:isDropTarget?`2px dashed ${AC}`:"2px solid #E2E8F0",minHeight:200,display:"flex",flexDirection:"column",transition:"all .15s"}}>
              {/* Column header */}
              <div style={{padding:"10px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #E2E8F0"}}>
                <div style={{display:"flex",alignItems:"center",gap:7}}>
                  <span style={{width:8,height:8,borderRadius:"50%",background:cfg.dot,display:"inline-block"}}/>
                  <span style={{fontWeight:700,fontSize:13,color:"#1E293B"}}>{status}</span>
                  <span style={{fontSize:11,background:cfg.bg,color:cfg.tx,borderRadius:999,padding:"1px 7px",fontWeight:600}}>{cards.length}</span>
                </div>
                {!Object.keys(STATUS_CFG).includes(status)&&<button onClick={()=>remKCol(status)} style={{border:"none",background:"none",cursor:"pointer",color:"#F87171",fontSize:12}}>✕</button>}
              </div>
              {/* Cards */}
              <div style={{padding:"8px",flex:1,display:"flex",flexDirection:"column",gap:8}}>
                {cards.map(t=>(
                  <div key={t.id}
                    draggable
                    onDragStart={()=>setDragKId(t.id)}

function UserDropdown(){
  const {currentUser,setCurrentUser,tasks,projName,columns,taskStyles,setShowUserMgr,setShowColMgr,setShowExe}=useCx();
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h)},[]);

  const doCSV=()=>{const h=["WBS","Task","Assignee","Start","End","Days","Pred","% Done","Status","Priority","Budget","Actual","Notes"];const r=tasks.map(t=>[t.wbs,t.name,t.asn,t.start,t.end,t.dur,t.pred,t.prog,t.status,t.prio,t.budget,t.spent,t.notes]);const csv=[h,...r].map(row=>row.map(c=>`"${c??""}"` ).join(",")).join("\n");const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download=projName+".csv";a.click()};
  const doXLSX=()=>{const ws=XLSX.utils.json_to_sheet(tasks.map(t=>({"WBS":t.wbs,"Task Name":t.name,"Assignee":t.asn,"Start":t.start,"Finish":t.end,"Days":t.dur,"Predecessors":t.pred,"% Done":t.prog,"Status":t.status,"Priority":t.prio,"Budget":t.budget,"Actual":t.spent,"Notes":t.notes})));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Tasks");XLSX.writeFile(wb,projName+".xlsx")};
  const doHTMLXLS=()=>{
    const visCols=columns.filter(c=>c.visible);
    const statusColors={"Completed":"#DCFCE7","In Progress":"#DBEAFE","Not Started":"#F1F5F9","On Hold":"#FEF9C3","Blocked":"#FFE4E6"};
    const prioColors={"Low":"#DCFCE7","Medium":"#FEF9C3","High":"#FFE4E6","Critical":"#F3E8FF"};
    let html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"/><style>td,th{border:1px solid #E2E8F0;padding:6px 10px;font-size:12px;font-family:Calibri,sans-serif}th{background:#1A2044;color:white;font-weight:bold}tr:nth-child(even) td{background:#F8FAFF}</style></head><body><table>`;
    html+=`<tr>${visCols.map(c=>`<th>${c.label}</th>`).join("")}</tr>`;
    tasks.forEach(t=>{
      const sty=taskStyles[t.id]||{};
      html+=`<tr style="background:${sty.rowBg||''};font-weight:${sty.bold?"bold":"normal"};color:${sty.txColor||""}">`;
      visCols.forEach(c=>{
        let v=t[c.field]??"";let cs="";
        if(c.type==="currency")v="$"+Number(v||0).toLocaleString();
        if(c.field==="status"&&statusColors[v])cs=`background:${statusColors[v]};`;
        if(c.field==="prio"&&prioColors[v])cs=`background:${prioColors[v]};`;
        if(c.type==="progress")v=v+"%";
        html+=`<td style="${cs}">${v}</td>`;
      });
      html+="</tr>";
    });
    html+="</table></body></html>";
    const blob=new Blob([html],{type:"application/vnd.ms-excel"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=projName+"_formatted.xls";a.click();URL.revokeObjectURL(url);
  };
  const doJSON=()=>{const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify({project:projName,exported:new Date().toISOString(),tasks},null,2));a.download=projName+".json";a.click()};

  const items=[
    {label:"My Profile",action:()=>{alert(`Name: ${currentUser?.name}\nEmail: ${currentUser?.email}\nRole: ${currentUser?.role}`)}},
    {label:"Team Members",action:()=>{setShowUserMgr(true);setOpen(false)}},
    {label:"Column Settings",action:()=>{setShowColMgr(true);setOpen(false)}},
    {sep:true},
    {label:"Export — Excel (formatted)",action:()=>{doHTMLXLS();setOpen(false)}},
    {label:"Export — XLSX (raw)",action:()=>{doXLSX();setOpen(false)}},
    {label:"Export — CSV",action:()=>{doCSV();setOpen(false)}},
    {label:"Export — JSON",action:()=>{doJSON();setOpen(false)}},
    {label:"Print / PDF",action:()=>{window.print();setOpen(false)}},
    {sep:true},
    {label:"Convert to Desktop App",action:()=>{setShowExe(true);setOpen(false)}},
    {sep:true},
    {label:"Logout",action:()=>{setCurrentUser(null);saveLS(CU_KEY,null);setOpen(false)},danger:true},
  ];

  return(
    <div ref={ref} style={{position:"relative",flexShrink:0}}>
      <button onClick={()=>setOpen(!open)} style={{display:"flex",alignItems:"center",gap:8,background:open?"#F0F4FF":"#F8FAFF",border:"1px solid #E2E8F0",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontFamily:"inherit"}}>
        <div style={{width:26,height:26,borderRadius:"50%",background:currentUser?.color||AC,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:"white"}}>{currentUser?.initials||"?"}</div>
        <span style={{fontSize:13,fontWeight:600,color:"#1E293B"}}>{currentUser?.name||"User"}</span>
        <span style={{fontSize:10,color:"#94A3B8"}}>{open?"":""}</span>
      </button>
      {open&&(
        <div style={{position:"absolute",top:"calc(100% + 6px)",right:0,background:"white",borderRadius:12,boxShadow:"0 8px 40px rgba(0,0,0,0.18)",border:"1px solid #E2E8F0",minWidth:240,zIndex:200,overflow:"hidden"}}>
          <div style={{padding:"10px 14px",borderBottom:"1px solid #F1F5F9",background:"#F8FAFF"}}>
            <div style={{fontSize:13,fontWeight:700,color:"#1E293B"}}>{currentUser?.name}</div>
            <div style={{fontSize:11,color:"#94A3B8"}}>{currentUser?.email}</div>
          </div>
          {items.map((item,i)=>item.sep?<div key={i} style={{height:1,background:"#F1F5F9",margin:"3px 0"}}/>:(
            <div key={i} onClick={item.action} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 14px",cursor:"pointer",color:item.danger?"#EF4444":"#374151",fontSize:13}}
              onMouseEnter={e=>e.currentTarget.style.background=item.danger?"#FFF1F2":"#F8FAFF"}
              onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <span style={{fontSize:14,width:20}}>{item.icon}</span>{item.label}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ═══ APP ════════════════════════════════════════════════ */
function App(){
  /* ── Auth ───────────────────────────── */
  const [users,setUsers]      = useState(()=>loadLS(USERS_KEY)||DEF_USERS);
  const [currentUser,setCurrentUser]=useState(()=>{const u=loadLS(CU_KEY);return u&&(loadLS(USERS_KEY)||DEF_USERS).find(x=>x.id===u.id)?u:null});

  /* ── Projects ───────────────────────── */
  const [projects,setProjects]= useState(()=>{
    let idx=loadLS(IDX_KEY)||[];
    if(idx.length===0){const id=uid(),now=new Date().toISOString();idx=[{id,name:"Q3 Digital Platform Launch",taskCount:DEF_TASKS.length,createdAt:now,updatedAt:now}];saveLS(IDX_KEY,idx);saveLS(PK(id),{name:idx[0].name,tasks:DEF_TASKS});}
    return idx;
  });
  const [activeProjectId,setActiveProjectId]=useState(()=>loadLS(ACTIVE_KEY)||(loadLS(IDX_KEY)||[{id:null}])[0]?.id);

  /* ── Working state ──────────────────── */
  const [tasks,setTasks]      = useState(()=>{const d=loadLS(PK(loadLS(ACTIVE_KEY)||(loadLS(IDX_KEY)||[{}])[0]?.id));return d?.tasks||DEF_TASKS});
  const [projName,setProjName]= useState(()=>{const d=loadLS(PK(loadLS(ACTIVE_KEY)||(loadLS(IDX_KEY)||[{}])[0]?.id));return d?.name||"My Project"});
  const [columns,setColumns]  = useState(()=>loadLS("pmhub2_cols")||DEF_COLS);
  const [taskStyles,setTaskStyles]=useState({});
  const [view,setView]        = useState("sheet");
  const [q,setQ]              = useState("");
  const [statusFilter,setStatusFilter]=useState("all");
  const [sort,setSort]        = useState({f:"",d:"asc"});
  const [editing,setEditing]  = useState(null);
  const [editVal,setEditVal]  = useState("");
  const [collapsed,setCollapsed]=useState(new Set());
  const [cardId,setCardId]    = useState(null);
  const [saveStatus,setSaveStatus]=useState("saved");

  /* ── Modals ─────────────────────────── */
  const [showUserMgr,setShowUserMgr]=useState(false);
  const [showColMgr,setShowColMgr]=useState(false);
  const [showExe,setShowExe]  = useState(false);

  /* ── Save columns ───────────────────── */
  useEffect(()=>saveLS("pmhub2_cols",columns),[columns]);

  /* ── Auto-save project locally and to Node backend ───── */
  useEffect(()=>{
    if(!activeProjectId)return;
    setSaveStatus("unsaved");
    const t=setTimeout(async ()=>{
      setSaveStatus("saving");
      const now=new Date().toISOString();
      const savedProjects=loadLS(IDX_KEY)||projects||[];
      const upd=savedProjects.map(p=>p.id===activeProjectId?{...p,name:projName,taskCount:tasks.length,updatedAt:now}:p);
      saveLS(PK(activeProjectId),{name:projName,tasks});
      saveLS(IDX_KEY,upd);
      setProjects(upd);
      try{
        await apiSend(`/api/projects/${activeProjectId}`,"PUT",{name:projName,tasks});
      }catch(err){
        console.warn("Backend autosave failed, local copy still saved",err);
      }
      setSaveStatus("saved");
    },700);
    return()=>clearTimeout(t);
  },[tasks,projName,activeProjectId]);

  /* ── Load projects from Node backend on startup ───────── */
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      try{
        const backendProjects=await apiGet("/api/projects");
        if(cancelled||!Array.isArray(backendProjects)||backendProjects.length===0)return;
        saveLS(IDX_KEY,backendProjects);
        setProjects(backendProjects);
        const wanted=backendProjects.find(p=>p.id===activeProjectId)?.id || backendProjects[0].id;
        const full=await apiGet(`/api/projects/${wanted}`);
        if(cancelled)return;
        saveLS(ACTIVE_KEY,wanted);
        saveLS(PK(wanted),{name:full.name,tasks:full.tasks||[]});
        setActiveProjectId(wanted);
        setProjName(full.name||"Untitled");
        setTasks(full.tasks||[]);
        setSaveStatus("saved");
      }catch(err){
        console.warn("Backend load failed, using local browser copy",err);
      }
    })();
    return()=>{cancelled=true};
  },[]);

  /* ── Load team users from backend ───── */
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      try{
        const backendUsers=await apiGet("/api/users");
        if(cancelled||!Array.isArray(backendUsers)||backendUsers.length===0)return;
        setUsers(backendUsers);
        saveLS(USERS_KEY,backendUsers);
      }catch(err){
        console.warn("Backend users load failed, using local users",err);
      }
    })();
    return()=>{cancelled=true};
  },[]);

  /* ── Team sync polling for shared online workspace ───── */
  useEffect(()=>{
    if(!activeProjectId||!currentUser)return;
    const timer=setInterval(async()=>{
      try{
        const full=await apiGet(`/api/projects/${activeProjectId}`);
        const local=JSON.stringify(tasks);
        const remote=JSON.stringify(full.tasks||[]);
        if(remote!==local && saveStatus==="saved"){
          setProjName(full.name||"Untitled");
          setTasks(full.tasks||[]);
          saveLS(PK(activeProjectId),{name:full.name,tasks:full.tasks||[]});
        }
      }catch(err){}
    },5000);
    return()=>clearInterval(timer);
  },[activeProjectId,currentUser,saveStatus,tasks]);

  /* ── Project operations ─────────────── */
  const openProject=useCallback(async id=>{
    if(activeProjectId){
      saveLS(PK(activeProjectId),{name:projName,tasks});
      try{await apiSend(`/api/projects/${activeProjectId}`,"PUT",{name:projName,tasks});}catch(err){console.warn("Could not save current project before switching",err);}
    }
    let d=loadLS(PK(id))||{name:"",tasks:[]};
    try{
      const fromBackend=await apiGet(`/api/projects/${id}`);
      d={name:fromBackend.name,tasks:fromBackend.tasks||[]};
      saveLS(PK(id),d);
    }catch(err){
      console.warn("Backend project load failed, using local browser copy",err);
    }
    setActiveProjectId(id);saveLS(ACTIVE_KEY,id);
    setProjName(d.name||"Untitled");setTasks(d.tasks||[]);
    setEditing(null);setQ("");setStatusFilter("all");setSaveStatus("saved");
  },[activeProjectId,projName,tasks]);

  const createProject=useCallback(async name=>{
    if(activeProjectId){
      saveLS(PK(activeProjectId),{name:projName,tasks});
      try{await apiSend(`/api/projects/${activeProjectId}`,"PUT",{name:projName,tasks});}catch(err){console.warn("Could not save current project before creating new one",err);}
    }
    const now=new Date().toISOString();
    let meta;
    try{
      meta=await apiSend("/api/projects","POST",{name:name||"New Project",tasks:[]});
    }catch(err){
      console.warn("Backend project create failed, creating local project only",err);
      meta={id:uid(),name:name||"New Project",taskCount:0,createdAt:now,updatedAt:now};
    }
    const idx=[meta,...(loadLS(IDX_KEY)||[]).filter(p=>p.id!==meta.id)];
    saveLS(IDX_KEY,idx);saveLS(PK(meta.id),{name:meta.name,tasks:[]});saveLS(ACTIVE_KEY,meta.id);
    setProjects(idx);setActiveProjectId(meta.id);setProjName(meta.name);setTasks([]);setSaveStatus("saved");
    return meta;
  },[activeProjectId,projName,tasks]);

  const deleteProject=useCallback(async id=>{
    if(!id)return;
    const target=projects.find(p=>p.id===id);
    if(!confirm(`Delete "${target?.name||"this project"}"? This cannot be undone.`))return;
    try{await fetch(`/api/projects/${id}`,{method:"DELETE"});}catch(err){console.warn("Backend delete failed, removing local copy only",err);}
    const nextProjects=(loadLS(IDX_KEY)||projects).filter(p=>p.id!==id);
    localStorage.removeItem(PK(id));
    saveLS(IDX_KEY,nextProjects);
    setProjects(nextProjects);
    if(id===activeProjectId){
      const next=nextProjects[0];
      if(next){
        saveLS(ACTIVE_KEY,next.id);
        setActiveProjectId(next.id);
        try{
          const full=await apiGet(`/api/projects/${next.id}`);
          setProjName(full.name||next.name||"Untitled");
          setTasks(full.tasks||[]);
          saveLS(PK(next.id),{name:full.name||next.name,tasks:full.tasks||[]});
        }catch(err){
          const d=loadLS(PK(next.id))||{name:next.name,tasks:[]};
          setProjName(d.name||next.name||"Untitled");
          setTasks(d.tasks||[]);
        }
      }else{
        const meta=await createProject("New Team Project");
        setActiveProjectId(meta.id);
      }
    }
  },[projects,activeProjectId,createProject]);

  /* ── Stats ──────────────────────────── */
  const stats=useMemo(()=>({
    total:tasks.length,
    done:tasks.filter(t=>t.status==="Completed").length,
    inProg:tasks.filter(t=>t.status==="In Progress").length,
    blocked:tasks.filter(t=>t.status==="Blocked").length,
    budget:tasks.filter(t=>t.level===0).reduce((s,t)=>s+(t.budget||0),0),
    spent:tasks.filter(t=>t.level===0).reduce((s,t)=>s+(t.spent||0),0),
    avgProg:tasks.length?Math.round(tasks.reduce((s,t)=>s+(t.prog||0),0)/tasks.length):0,
  }),[tasks]);

  const saveColor=saveStatus==="saved"?"#22C55E":saveStatus==="saving"?"#F59E0B":"#94A3B8";
  const saveLabel=saveStatus==="saved"?" Saved":saveStatus==="saving"?"Saving…":"● Unsaved";

  const ctxVal={
    users,setUsers,currentUser,setCurrentUser,
    projects,setProjects,activeProjectId,openProject,createProject,deleteProject,
    tasks,setTasks,projName,setProjName,
    columns,setColumns,taskStyles,setTaskStyles,
    view,setView,q,setQ,statusFilter,setStatusFilter,sort,setSort,
    editing,setEditing,editVal,setEditVal,
    collapsed,setCollapsed,
    cardId,setCardId,stats,
    showUserMgr,setShowUserMgr,showColMgr,setShowColMgr,showExe,setShowExe,
  };

  if(!currentUser) return <Ctx.Provider value={ctxVal}><LoginScreen/></Ctx.Provider>;

  return(
    <Ctx.Provider value={ctxVal}>
      <div style={{display:"flex",height:"100vh",fontFamily:"'Plus Jakarta Sans',system-ui,sans-serif",overflow:"hidden",position:"relative"}}>
        <Sidebar/>
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0}}>
          {/* Header */}
          <div style={{background:"white",borderBottom:"1px solid #E2E8F0",height:52,display:"flex",alignItems:"center",padding:"0 18px",gap:12,flexShrink:0}}>
            <input value={projName} onChange={e=>setProjName(e.target.value)} style={{border:"none",outline:"none",fontSize:16,fontWeight:800,color:"#1E293B",background:"transparent",fontFamily:"inherit",flex:1,minWidth:0}}/>
            <span style={{fontSize:11,fontWeight:600,color:saveColor,flexShrink:0}}>{saveLabel}</span>
            <div style={{width:1,height:20,background:"#E2E8F0"}}/>
            <UserDropdown/>
          </div>
          {/* Stats strip */}
          {view!=="dashboard"&&(
            <div style={{display:"flex",gap:10,padding:"8px 18px",background:"#F8FAFF",borderBottom:"1px solid #E2E8F0",flexShrink:0,overflowX:"auto"}}>
              {[{l:"Tasks",v:stats.total,c:"#6366F1"},{l:"Completed",v:stats.done,c:"#16A34A"},{l:"In Progress",v:stats.inProg,c:"#2563EB"},{l:"Blocked",v:stats.blocked,c:"#BE123C"},{l:"Overall",v:stats.avgProg+"%",c:"#6366F1"},{l:"Budget",v:fmtC(stats.budget),c:"#059669"},{l:"Spent",v:fmtC(stats.spent),c:"#D97706"},{l:"Remaining",v:fmtC(stats.budget-stats.spent),c:stats.budget-stats.spent<0?"#BE123C":"#6366F1"}].map(({l,v,c})=>(
                <div key={l} style={{background:"white",border:"1px solid #E2E8F0",borderRadius:9,padding:"6px 12px",flexShrink:0}}>
                  <div style={{fontSize:9,color:"#94A3B8",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:2}}>{l}</div>
                  <div style={{fontSize:16,fontWeight:800,color:c}}>{v}</div>
                </div>
              ))}
            </div>
          )}
          {/* Toolbar */}
          {(view==="sheet"||view==="kanban")&&(
            <div style={{display:"flex",gap:8,padding:"6px 18px",background:"white",borderBottom:"1px solid #E2E8F0",flexShrink:0,alignItems:"center"}}>
              <div style={{position:"relative",flex:1,maxWidth:200}}>
                <span style={{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",color:"#94A3B8",fontSize:13}}></span>
                <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search…" style={{width:"100%",paddingLeft:24,height:30,border:"1px solid #E2E8F0",borderRadius:7,fontSize:12,outline:"none",fontFamily:"inherit",boxSizing:"border-box",color:"#374151"}}/>
                {q&&<button onClick={()=>setQ("")} style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",border:"none",background:"none",cursor:"pointer",color:"#94A3B8",fontSize:14,padding:0}}></button>}
              </div>
              <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{height:30,border:"1px solid #E2E8F0",borderRadius:7,fontSize:12,padding:"0 8px",outline:"none",fontFamily:"inherit",color:"#475569",cursor:"pointer"}}>
                <option value="all">All Statuses</option>
                {Object.keys(STATUS_CFG).map(s=><option key={s}>{s}</option>)}
              </select>
              {view==="sheet"&&<button onClick={()=>setShowColMgr(true)} style={{height:30,border:"1px solid #E2E8F0",borderRadius:7,fontSize:12,padding:"0 10px",background:"white",color:"#6366F1",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}> Columns</button>}
              <button onClick={()=>{setQ("");setStatusFilter("all");setSort({f:"",d:"asc"})}} style={{height:30,border:"1px solid #E2E8F0",borderRadius:7,fontSize:12,padding:"0 10px",background:"white",color:"#94A3B8",cursor:"pointer",fontFamily:"inherit"}}>↺</button>
            </div>
          )}
          {/* Views */}
          <div style={{flex:1,overflow:"hidden",position:"relative",background:view==="dashboard"?"#F8FAFF":"white"}}>
            {view==="dashboard"&&<Dashboard/>}
            {view==="sheet"   &&<SheetView/>}
            {view==="gantt"   &&<GanttView/>}
            {view==="wbs"     &&<WBSView/>}
            {view==="kanban"  &&<KanbanView/>}
          </div>
        </div>

        {/* Modals & panels */}
        {cardId      &&<TaskCard/>}
        {showColMgr  &&<ColMgr/>}
        {showUserMgr &&<UserMgr/>}
        {showExe     &&<ExeModal/>}
      </div>
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
